# WYRE Centraal op een eigen server: database, serverprogramma en webserver (https).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wyre
      POSTGRES_USER: wyre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wyre -d wyre"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wyre:${POSTGRES_PASSWORD}@db:5432/wyre
      SECRET: ${SECRET:?zet SECRET in .env}
      STANDAARD_PW: ${STANDAARD_PW:-0123456789}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAAM: ${ADMIN_NAAM:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  dbdata:
  caddydata:
  caddyconfig:
