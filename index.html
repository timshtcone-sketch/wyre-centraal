<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WYRE Centraal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: rustig werkinstrument voor een vezelteam, feiten eerst
   IDEA: de netwerktekening — kleuren van feed, primair, dist en las zoals op de trackers
   PICTURE: het overzicht per POP-zone met voortgangsbalken in die kleuren
   COLOUR and TYPE: wit/inkt, diep petrol als accent, tekeningkleuren voor status; Inter
   LAYOUT: vaste kopbalk, één kolom tot 1240px, tabellen die op de telefoon stapelen */
:root{color-scheme:light dark;
 --bg:light-dark(#f6f7f8,#0f1416);--card:light-dark(#fff,#162024);--ink:light-dark(#14181b,#e8eef0);
 --mute:light-dark(#5d6a70,#93a3a9);--line:light-dark(#e1e6e8,#26343a);--acc:light-dark(#0b5d63,#4fb3ba);
 --acc-ink:#fff;--warn:light-dark(#9a4b00,#ffb067);--bad:light-dark(#b3261e,#ff8a80);
 --feed:#2e9d4a;--prim:#e6b800;--dist:#2f6fd6;--gevel:#64b5f6;--aerial:#d64f9a;--las:#e05aa3}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,3.4vw,36px)}h2{font-size:20px}h3{font-size:16px}
a{color:var(--acc)}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px max(4vw,14px);flex-wrap:wrap}
.brand{font:600 18px "Inter Tight",sans-serif;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{display:inline-flex;gap:2px}.brand i b{width:5px;height:18px;border-radius:2px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
nav a.on{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.who{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center}
#thema{min-height:36px;padding:0 10px;font-size:13px}
.uc{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.uc .card h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pct{font:600 20px 'Inter Tight',sans-serif;font-variant-numeric:tabular-nums}
.big{height:12px;border-radius:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13.5px;margin:10px 0}
.kv b{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.late{color:var(--bad)}.ok{color:var(--feed)}
main{max-width:1240px;margin:0 auto;padding:clamp(18px,3vw,36px) max(4vw,14px) 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font:600 clamp(24px,3vw,32px) "Inter Tight",sans-serif;white-space:nowrap}
.kpi .l{color:var(--mute);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
input,select,button,textarea{font:inherit;font-size:16px}
input,select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-height:44px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:2px}
button{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-weight:500}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
button.bad{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
button.link{border:0;background:none;color:var(--acc);padding:0 4px;min-height:32px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--mute);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:color-mix(in srgb,var(--acc) 6%,transparent)}
.scroll{overflow-x:auto}
.muted{color:var(--mute)}.small{font-size:13px}p{overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12.5px;border:1px solid var(--line);margin:2px 4px 2px 0;white-space:nowrap;background:var(--card)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);min-width:90px}
.bar span{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:6px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend b{width:12px;height:4px;border-radius:2px;display:inline-block}
.dp{margin-top:16px}
.dp h3{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.msg{padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--acc) 10%,transparent);margin:12px 0}
.msg.warn{background:color-mix(in srgb,var(--warn) 14%,transparent)}
.msg.bad{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.auth{max-width:420px;margin:8vh auto;display:grid;gap:12px}
.auth label{display:grid;gap:4px;font-size:14px;font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:6px}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none}
.tabs button.on{border-bottom-color:var(--acc);color:var(--acc)}
details summary{cursor:pointer;color:var(--acc);font-weight:500;min-height:32px}
.hidden{display:none!important}
@media(max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:8em;margin-inline-start:-8.5em;color:var(--mute);font-size:12px}.stack td:empty{display:none}.who span{display:none}}
@media(prefers-reduced-motion:no-preference){.fade{animation:f .25s ease-out}@keyframes f{from{opacity:0;transform:translateY(4px)}}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i><b style="background:var(--feed)"></b><b style="background:var(--prim)"></b><b style="background:var(--dist)"></b><b style="background:var(--las)"></b></i>WYRE Centraal</div>
  <nav id="nav" class="hidden">
    <a href="#overzicht" data-v="overzicht">Overzicht</a>
    <a href="#uitrol" data-v="uitrol">Uitrol nov dec</a>
    <a href="#import" data-v="import" class="beheer">Import</a>
    <a href="#team" data-v="team" class="beheer">Team</a>
  </nav>
  <button id="thema" type="button" aria-label="Thema kiezen">Thema: auto</button>
  <div class="who hidden" id="who"><span id="whoMail"></span><button class="link" id="uit">Uitloggen</button></div>
</header>
<main id="app"><p class="muted">Laden…</p></main>

<script>
// WYRE Centraal — Actuals-Excel parser. Werkt in de browser (SheetJS) en in Node (tests).
const WYRE = (() => {
  const pad = (v, n) => String(v).padStart(n, '0');
  const txt = v => (v === null || v === undefined) ? '' : String(v).trim();
  const num = v => {
    if (v === null || v === undefined || v === '') return null;
    const n = Number(String(v).replace(',', '.'));
    return Number.isFinite(n) ? n : null;
  };
  const pad3 = v => /^\d{1,3}$/.test(txt(v)) ? pad(txt(v), 3) : txt(v);

  function normKabel(raw) {
    let s = txt(raw).toUpperCase().replace(/\s+/g, '').replace(/->|>/g, '-');
    if (!s) return '';
    if (s === 'FEED') return 'FEED';
    if (s.includes('-')) {
      const parts = s.split('-').filter(Boolean).map(p => {
        const m = p.match(/^(\d{1,3})([A-E]?)$/);
        return m ? pad(m[1], 3) + m[2] : p;
      });
      return parts.join('-');
    }
    const m = s.match(/^(\d{1,3})([A-E]?)$/);
    return m ? pad(m[1], 3) + m[2] : s;
  }

  function normPoc(raw) {
    const s = txt(raw).toUpperCase().replace(/\s+/g, '');
    if (!s) return '';
    const m = s.match(/(\d{2,3})([A-E])(M?)(\d{1,2})/);
    return m ? pad(m[1], 3) + m[2] + m[3] + pad(m[4], 2) : s;
  }

  function kabelSoort(k) {
    if (k === 'FEED') return 'feed';
    if (k.includes('-')) return 'primair';
    if (/^\d{3}[A-E]$/.test(k)) return 'dist';
    return 'overig';
  }

  function pocType(v) {
    const s = txt(v).toLowerCase();
    if (s.startsWith('aer')) return 'Aerial';
    if (s.startsWith('fa') || s.startsWith('gev')) return 'Façade';
    return 'UG';
  }

  function toDate(v) {
    if (v === null || v === undefined || v === '') return '';
    if (v instanceof Date && !isNaN(v)) {
      return `${v.getFullYear()}-${pad(v.getMonth() + 1, 2)}-${pad(v.getDate(), 2)}`;
    }
    if (typeof v === 'number') { // Excel-serienummer
      const d = new Date(Math.round((v - 25569) * 86400000));
      return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1, 2)}-${pad(d.getUTCDate(), 2)}`;
    }
    const s = txt(v);
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return `${m[1]}-${pad(m[2], 2)}-${pad(m[3], 2)}`;
    m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);
    if (m) return `${m[3]}-${pad(m[2], 2)}-${pad(m[1], 2)}`;
    return '';
  }

  const zoneId = (hub, pop) => `MRO_${txt(hub).toUpperCase().replace(/\s+/g, '_')}_POP_${pad3(pop)}`;
  const zoneLabel = (hub, pop) => {
    const h = txt(hub).toUpperCase();
    const m = h.match(/^(.*?)_?(\d+)$/);
    const naam = m ? m[1] : h;
    const nr = m ? m[2] : '';
    const mooi = naam.toLowerCase().replace(/(^|[-\s_])(\w)/g, (a, b, c) => (b === '_' ? ' ' : b) + c.toUpperCase());
    return `${mooi}${nr ? ' ' + nr : ''} · POP ${pad3(pop)}`;
  };

  function headerIndex(header) {
    const h = header.map(x => txt(x).toLowerCase());
    const find = (...names) => {
      for (const n of names) { const i = h.findIndex(x => x === n || x.startsWith(n)); if (i >= 0) return i; }
      return -1;
    };
    return {
      hub: find('hub/mro zone', 'hub', 'mro'), pop: find('popzone', 'pop zone', 'pop'),
      dp: find('dp nr', 'dp'), kabel: find('kabelnr', 'kabel'), werk: find('werktype'),
      poc: find('poc nr', 'poc'), type: find('façade/ug', 'facade/ug', 'façade', 'facade'),
      lasjes: find('aantal lasjes', 'lasjes'), kabeltype: find('type kabel'),
      meters: find('meters blazen', 'meters'), boqOk: find('boq ok'), boqNr: find('boq nummer'),
      end: find('enddate', 'einddatum'), aannemer: find('aannemer'), comment: find('commentaar', 'opmerking'),
      gepland: find('ingeplande datum', 'gepland')
    };
  }

  function classify(r) {
    const werk = r.w.toLowerCase();
    if (werk === 'blazen' && r.k && !r.l) return 'blazen';
    if (r.p) return 'poc-las';
    if (['blazen', 'facade', 'aerial', 'gevel'].includes(werk) && (r.m || r.k)) return 'blazen';
    if (werk === 'lassen' || r.l) {
      if (r.k === 'FEED') return 'feed-las';
      return r.dp === '010' ? 'pdp-las' : 'dp-las';
    }
    if (r.m) return 'blazen';
    return 'overig';
  }

  function blaasType(r) {
    const werk = r.w.toLowerCase();
    if (werk === 'facade' || werk === 'gevel') return 'gevel';
    if (werk === 'aerial') return 'aerial';
    return kabelSoort(r.k);
  }

  // rows: array van arrays (eerste rij = kopteksten). Geeft {rijen, waarschuwingen}.
  function parseActuals(rows, tabNaam) {
    const out = [], warn = [];
    if (!rows.length) return { rijen: out, waarschuwingen: warn };
    const ix = headerIndex(rows[0]);
    const get = (row, k) => ix[k] >= 0 ? row[ix[k]] : null;
    const jaar = (tabNaam.match(/20\d\d/) || [''])[0];
    rows.slice(1).forEach((row, i) => {
      if (!row || !row.slice(0, 6).some(v => txt(v) !== '')) return;
      const hub = txt(get(row, 'hub')), pop = txt(get(row, 'pop'));
      if (!hub || !pop) { warn.push(`${tabNaam} rij ${i + 2}: geen HUB/POP-zone`); return; }
      const kRaw = txt(get(row, 'kabel')), pRaw = txt(get(row, 'poc'));
      const r = {
        z: zoneId(hub, pop), j: jaar, n: i + 2, w: txt(get(row, 'werk')),
        dp: pad3(get(row, 'dp')), k: normKabel(kRaw), p: normPoc(pRaw),
        t: pocType(get(row, 'type')), l: num(get(row, 'lasjes')), kt: txt(get(row, 'kabeltype')),
        m: num(get(row, 'meters')), d: toDate(get(row, 'end')), a: txt(get(row, 'aannemer')),
        c: txt(get(row, 'comment')), b: txt(get(row, 'boqNr')), bo: get(row, 'boqOk') === true
      };
      if (!r.k && /blazen/i.test(r.w)) { // primaire kabel staat soms alleen in het commentaar ("010 - 015")
        const m = r.c.match(/\b(0?\d{2})\s*-\s*(0?\d{2})(?:\s*-\s*(0?\d{2}))?(?:\s*-\s*(0?\d{2}))?/);
        if (m) { r.k = normKabel(m.slice(1).filter(Boolean).join('-')); r.kc = 1; }
      }
      if (kRaw && r.k !== kRaw.toUpperCase()) r.kr = kRaw;
      if (pRaw && r.p !== pRaw.toUpperCase()) r.pr = pRaw;
      if (r.p && !/^\d{3}[A-E]M?\d{2}$/.test(r.p)) warn.push(`${tabNaam} rij ${r.n}: POC "${pRaw}" niet herkend`);
      if (r.p && /BDP/i.test(pRaw)) r.bdp = true;
      r.s = classify(r);
      if (r.s === 'blazen') r.bt = blaasType(r);
      if (!r.d) warn.push(`${tabNaam} rij ${r.n}: geen einddatum`);
      for (const key of Object.keys(r)) if (r[key] === '' || r[key] === null || r[key] === false) delete r[key];
      out.push(r);
    });
    return { rijen: out, waarschuwingen: warn };
  }

  function parseGepland(rows, tabNaam) {
    const out = [];
    if (!rows.length) return out;
    const ix = headerIndex(rows[0]);
    const get = (row, k) => ix[k] >= 0 ? row[ix[k]] : null;
    rows.slice(1).forEach(row => {
      if (!row) return;
      const hub = txt(get(row, 'hub')), pop = txt(get(row, 'pop'));
      if (!hub || !pop) return;
      const g = { z: zoneId(hub, pop), dp: pad3(get(row, 'dp')), k: normKabel(get(row, 'kabel')),
        w: txt(get(row, 'werk')), d: toDate(get(row, 'gepland')), c: txt(row[(ix.gepland >= 0 ? ix.gepland : 5) + 1]) };
      for (const key of Object.keys(g)) if (g[key] === '') delete g[key];
      out.push(g);
    });
    return out;
  }

  // sheets: [{naam, rows}] → {zones: {id: {...}}, totaal, waarschuwingen}
  function buildZones(sheets) {
    const zones = {}, warn = [];
    let totaal = 0;
    const zone = (id, hub, pop) => zones[id] || (zones[id] = { id, hub, pop: pad3(pop), label: zoneLabel(hub, pop), rijen: [], gepland: [] });
    for (const sh of sheets) {
      const n = sh.naam.toLowerCase();
      if (n.startsWith('actuals')) {
        const res = parseActuals(sh.rows, sh.naam);
        warn.push(...res.waarschuwingen);
        const ix = headerIndex(sh.rows[0] || []);
        res.rijen.forEach(r => {
          const src = sh.rows[r.n - 1];
          zone(r.z, txt(src[ix.hub]).toUpperCase(), txt(src[ix.pop])).rijen.push(r);
          totaal++;
        });
      } else if (n.includes('nog blazen') || n.includes('gepland') || n.includes('planning')) {
        const ix = headerIndex(sh.rows[0] || []);
        parseGepland(sh.rows, sh.naam).forEach((g, i) => {
          const src = sh.rows.slice(1).filter(r => r && txt(r[ix.hub]) && txt(r[ix.pop]))[i];
          zone(g.z, txt(src[ix.hub]).toUpperCase(), txt(src[ix.pop])).gepland.push(g);
        });
      }
    }
    for (const z of Object.values(zones)) {
      z.rijen.forEach(r => delete r.z);
      z.gepland.forEach(g => delete g.z);
      z.rijen.sort((a, b) => (a.d || '').localeCompare(b.d || ''));
    }
    return { zones, totaal, waarschuwingen: warn };
  }

  // Samenvatting van één zone (gebruikt door overzicht en detail).
  function summarize(z) {
    const kabels = {}, pocs = {}, dps = {};
    let meters = 0, lasjes = 0, laatste = '';
    for (const r of z.rijen) {
      if (r.d && r.d > laatste) laatste = r.d;
      if (r.l) lasjes += r.l;
      if (r.s === 'blazen' && r.k) {
        const k = kabels[r.k] || (kabels[r.k] = { k: r.k, soort: r.bt, meters: 0, d: '', a: new Set(), kt: '', dp: r.dp });
        k.meters += r.m || 0; meters += r.m || 0;
        if ((r.d || '') > k.d) k.d = r.d;
        if (r.a) k.a.add(r.a);
        if (r.kt) k.kt = r.kt;
        if (r.bt === 'gevel' || r.bt === 'aerial') k.soort = r.bt;
      } else if (r.s === 'poc-las') {
        const p = pocs[r.p] || (pocs[r.p] = { p: r.p, t: r.t, d: '', l: 0, a: new Set(), dp: r.dp, k: r.k });
        p.l += r.l || 0;
        if ((r.d || '') > p.d) p.d = r.d;
        if (r.a) p.a.add(r.a);
        if (r.t && r.t !== 'UG') p.t = r.t;
      } else if (r.s === 'dp-las' || r.s === 'pdp-las' || r.s === 'feed-las') {
        const key = r.s === 'feed-las' ? 'FEED' : r.dp;
        (dps[key] || (dps[key] = [])).push(r);
      }
    }
    return { kabels: Object.values(kabels), pocs: Object.values(pocs), dps, meters, lasjes, laatste };
  }


  // ---------- Uitrol: HP-targetplanning en POC-lijst ----------
  const MAAND = { jan: 1, feb: 2, mar: 3, mrt: 3, apr: 4, may: 5, mei: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, okt: 10, nov: 11, dec: 12 };
  function popNaamToZone(naam) {
    const m = txt(naam).toUpperCase().match(/MRO_(.+?)_?POP_?(\d+)/);
    return m ? { id: zoneId(m[1], m[2]), hub: m[1], pop: pad3(m[2]) } : null;
  }
  // rows = blad "Detail per POP" (rij 1 jaartallen, rij 2 maanden)
  function parseTargets(rows) {
    const jr = rows[0] || [], mr = rows[1] || [];
    const kol = [];
    let jaar = null;
    for (let c = 0; c < mr.length; c++) {
      if (typeof jr[c] === 'number') jaar = jr[c];
      const naam = txt(mr[c]).toLowerCase();
      if (c === 4 && /^20\d\d$/.test(naam)) { kol.push({ c, key: naam }); continue; } // jaartotaal 2025
      if (jaar && MAAND[naam]) kol.push({ c, key: `${jaar}-${pad(MAAND[naam], 2)}` });
    }
    const pops = [];
    for (const r of rows.slice(2)) {
      if (!r) continue;
      const z = popNaamToZone(r[1]);
      if (!z) continue;
      const t = { id: z.id, hub: z.hub, pop: z.pop, label: zoneLabel(z.hub, z.pop), hp: num(r[3]) || 0, opm: txt(r[2]), m: {} };
      for (const k of kol) { const v = num(r[k.c]); if (v) t.m[k.key] = (t.m[k.key] || 0) + v; }
      pops.push(t);
    }
    return pops;
  }
  // HP per POC uit de Delivery planning: één tabblad per POP-zone (bv. MRO_STROMBEEKBVR_01_POP_04), kolommen Type / Label / # HP.
  function parseHpLijst(sheets) {
    const zones = {}; let n = 0;
    for (const sh of sheets) {
      const naam = sh.naam.toUpperCase().replace('STROMBEEKBVR', 'STROMBEEKBEVER');
      const z = popNaamToZone(naam);
      if (!z) continue;
      const hi = sh.rows.findIndex(r => r && r.some(v => /^#?\s*hp$/i.test(txt(v))));
      if (hi < 0) continue;
      const h = sh.rows[hi].map(v => txt(v).toLowerCase());
      const ti = h.indexOf('type'), li = h.indexOf('label'), pi = h.findIndex(v => /^#?\s*hp$/.test(v));
      const pocs = (zones[z.id] || (zones[z.id] = {}));
      for (const r of sh.rows.slice(hi + 1)) {
        if (!r || txt(r[ti]).toUpperCase() !== 'POC') continue;
        const poc = normPoc(r[li]); const hp = num(r[pi]);
        if (!poc || hp === null) continue;
        pocs[poc] = Math.max(pocs[poc] || 0, hp); n++;
      }
    }
    return { zones, n };
  }

  // Uitrol per zone. Target 2026 komt uit de HP-planning, gerealiseerd = POC's gelast in de Actuals × HP uit de HP-lijst.
  function uitrol(zone, target, hpPocs, maand) {
    const jaar = maand.slice(0, 4);
    const gelast = {};
    for (const r of (zone?.rijen || [])) if (r.s === 'poc-las' && r.p) {
      if (!(r.p in gelast) || (r.d || '') > gelast[r.p]) gelast[r.p] = r.d || '';
    }
    const lijst = hpPocs || {};
    let hpGelast = 0, hpJaar = 0, hpMaand = 0, hpLijst = 0, hpOpen = 0;
    const open = [], onbekend = [];
    for (const [p, hp] of Object.entries(lijst)) {
      hpLijst += hp;
      if (p in gelast) {
        const d = gelast[p] || '';
        hpGelast += hp;
        if (d.slice(0, 4) === jaar && d.slice(0, 7) <= maand) hpJaar += hp;
        if (d.slice(0, 7) === maand) hpMaand += hp;
      } else { open.push({ p, hp, m: /M\d\d$/.test(p) }); hpOpen += hp; }
    }
    for (const p of Object.keys(gelast)) if (!(p in lijst)) onbekend.push(p);
    let cum = 0;
    for (const [k, v] of Object.entries(target?.m || {})) if (k.length === 7 && k.slice(0, 4) === jaar && k <= maand) cum += v;
    return { gelast, hpGelast, hpJaar, hpMaand, hpLijst, hpOpen,
      open: open.sort((a, b) => a.p.localeCompare(b.p)), onbekend: onbekend.sort(),
      tMaand: target?.m?.[maand] || 0, cum, nodig: Math.max(0, cum - hpJaar), hpTot: target?.hp || hpLijst };
  }

  // ---------- Tekeningen (voortgangstrackers) ----------
  // Haalt de tekening uit een tracker-HTML: NET (kabels/nodes), TILES (achtergrond), TS/LV (tegelschaal).
  function parseTracker(html) {
    const pak = (naam) => {
      const i = html.indexOf('const ' + naam + '=');
      if (i < 0) return null;
      const s = i + naam.length + 7;
      let e = html.indexOf('\n', s); if (e < 0) e = html.length;
      let t = html.slice(s, e).trim();
      const stop = t.indexOf(';const '); if (stop >= 0) t = t.slice(0, stop);
      t = t.replace(/;\s*$/, '');
      return JSON.parse(t);
    };
    const net = pak('NET');
    if (!net || !net.items || !net.nodes) return null;
    let tiles = null; try { tiles = pak('TILES'); } catch (e) { tiles = null; }
    const plan = (html.match(/const PLAN='([^']+)'/) || [])[1] || '';
    const ts = +((html.match(/const TS=(\d+)/) || [])[1] || 512);
    let lv = [0.5, 1, 2, 4]; const m = html.match(/LV=(\[[^\]]*\])/); if (m) { try { lv = JSON.parse(m[1]); } catch (e) {} }
    const titel = ((html.match(/<title>([^<]*)<\/title>/) || [])[1] || plan).replace(/\s*Voortgang\s*$/i, '');
    return { plan, titel, ts, lv, net, tiles };
  }
  function trackerZone(plan) {
    const m = String(plan).toUpperCase().match(/MRO_(.+?)_POP_(\d{3})(\d{3})?$/);
    return m ? zoneId(m[1], m[2]) : null;
  }

  // Kleurt een tekening in vanuit de Actuals-regels van de zone. Geeft {id: {d, info:[...]}} en een lijst niet-gekoppelde regels.
  function kleurTekening(net, zone) {
    const on = {}, los = [];
    const items = net.items, nodes = net.nodes;
    const perKabel = {};
    for (const it of items) (perKabel[it.cable] || (perKabel[it.cable] = [])).push(it);
    for (const k in perKabel) perKabel[k].sort((a, b) => a.name.localeCompare(b.name));
    const zet = (id, r, tekst) => { const o = on[id] || (on[id] = { d: '', info: [] }); if ((r.d || '') > o.d) o.d = r.d || ''; o.info.push(tekst); };
    const nr = p => +((p.match(/(\d{1,2})$/) || [])[1] || 0);
    const pocIn = (txt, kabel) => [...String(txt || '').toUpperCase().matchAll(/\b(\d{2,3})([A-E])(M?)(\d{1,2})\b/g)]
      .map(m => normPoc(m[0])).filter(p => p.slice(0, 4) === kabel);
    for (const r of (zone?.rijen || [])) {
      const t = [r.d ? r.d.split('-').reverse().join('-') : '', r.w, r.a, r.m ? r.m + ' m' : '', r.kt ? r.kt + 'v' : '', r.l ? r.l + ' lasjes' : '', r.c].filter(Boolean).join(' · ');
      const werk = (r.w || '').toLowerCase();
      let gekoppeld = false;
      if (r.s === 'blazen' && r.k) {
        if (r.k === 'FEED') { for (const it of items.filter(i => i.type === 'feed')) { zet(it.id, r, t); gekoppeld = true; } }
        else if (r.k.includes('-')) {
          const dps = r.k.split('-');
          let kand = items.filter(i => i.type === 'prim' && i.cable === r.k);
          if (!kand.length) kand = items.filter(i => i.type === 'prim' && dps.slice(1).every(d => i.cable.split('-').includes(d)));
          for (const it of kand) { zet(it.id, r, t); gekoppeld = true; }
        } else if (perKabel[r.k]) {
          let segs = perKabel[r.k];
          const c = String(r.c || '');
          const tot = c.match(/\btot\b(.*)$/i), van = c.match(/\bvan\b\s*(\S+)/i);
          if (r.p && (werk === 'facade' || werk === 'aerial' || werk === 'gevel')) segs = segs.filter(i => i.name === r.p);
          else if (tot) {
            const na = pocIn(tot[1], r.k).map(nr); const vanNr = van ? (pocIn(van[1], r.k).map(nr)[0] || 0) : 0;
            if (na.length) { const max = Math.max(...na); segs = segs.filter(i => { const n = nr(i.name); return n > vanNr && n <= max; }); }
          }
          for (const it of segs) { zet(it.id, r, t); gekoppeld = true; }
        }
      }
      if (r.p && (r.s === 'poc-las' || werk === 'facade' || werk === 'aerial')) {
        if (r.p in nodes) { zet('N-' + r.p, r, t); gekoppeld = true; }
        if (werk === 'facade' || werk === 'aerial') { const seg = items.find(i => i.name === r.p); if (seg) { zet(seg.id, r, t); gekoppeld = true; } }
      }
      if ((r.s === 'dp-las' || r.s === 'pdp-las') && r.dp && r.dp in nodes) { zet('N-' + r.dp, r, t); gekoppeld = true; }
      if (r.s === 'feed-las' && '010' in nodes) { zet('N-010', r, t); gekoppeld = true; }
      if (!gekoppeld && r.s !== 'overig') los.push(r);
    }
    return { on, los };
  }

  return { parseTracker, trackerZone, kleurTekening, parseTargets, parseHpLijst, uitrol, popNaamToZone, normKabel, normPoc, kabelSoort, toDate, zoneId, zoneLabel, parseActuals, parseGepland, buildZones, summarize };
})();
if (typeof module !== 'undefined') module.exports = WYRE;

const S = { tekIdx: {}, tekCache: {}, eindejaar: null, targets: null, hp: null, maand: '', user: null, rol: null, naam: '', zones: {}, meta: null, team: [], unsub: [], pending: null, zoneFilter: '', hub: '', uitrolData: undefined, uitrolVer: null };

const AUTHFOUT = {

    <label>Werk-e-mailadres<input type="email" id="em" autocomplete="username" required></label>
    <label>Wachtwoord<input type="password" id="pw" autocomplete="${mode === 'in' ? 'current-password' : 'new-password'}" minlength="8" required></label>

    <div id="am">${msg}</div>

  </form>`;

  const v = $('#vergeten');
  if (v) v.onclick = async () => {
    const em = $('#em').value.trim();

    catch (err) { say(fout(err), 'bad'); }

}

function verifyView(u) {
  app.innerHTML = `<div class="auth card fade"><h2>Bevestig je e-mailadres</h2>
    <p>We stuurden een mail naar <b>${esc(u.email)}</b>. Klik op de link in die mail (kijk ook bij ongewenste e-mail) en kom dan hier terug.</p>

  $('#klaar').onclick = async () => {
    await u.reload();
    if (auth.currentUser.emailVerified) { await auth.currentUser.getIdToken(true); start(auth.currentUser); }
    else say('Nog niet bevestigd. Klik eerst op de link in de mail.', 'warn');
  };
  $('#opn').onclick = async () => { try { await sendEmailVerification(u); say('Nieuwe mail verstuurd.'); } catch (e) { say(fout(e), 'bad'); } };

}

function wachtwoordWijzigenView(u) {

// Toont alleen gemeten feiten als de database het lezen van de toegang weigert.
async function diagnoseView(u, e) {
  app.innerHTML = '<p class="muted">Diagnose uitvoeren…</p>';
  const rij = [];
  const zet = (k, v) => rij.push([k, v]);
  zet('Firebase-project', firebaseConfig.projectId);
  zet('Ingelogd als (account)', u.email);
  let claims = null;
  try { claims = (await getIdTokenResult(u, true)).claims; } catch (x) { zet('Token vernieuwen', 'mislukt: ' + (x?.code || x?.message || x)); }
  if (claims) {
    zet('E-mail in het token', String(claims.email));
    zet('email_verified in het token', String(claims.email_verified));
    zet('Aanmeldmethode', String(claims.firebase?.sign_in_provider || ''));
  }
  const pad = 'toegang/' + u.email.toLowerCase();
  const probeer = async (label, ref) => {
    try { const d = await getDoc(ref); zet(label, 'toegestaan' + (d.exists() ? ' (document bestaat)' : ' (document bestaat niet)')); return d; }
    catch (x) { zet(label, 'geweigerd: ' + (x?.code || '') + ' — ' + (x?.message || '')); return null; }
  };
  zet('Eerste poging ' + pad, 'geweigerd: ' + (e?.code || '') + ' — ' + (e?.message || ''));
  const t2 = await probeer('Lezen ' + pad + ' (na token vernieuwen)', doc(db, 'toegang', u.email.toLowerCase()));
  await probeer('Lezen wyre/v1/meta/import', META());
  if (t2 && t2.exists()) return start(u); // na vernieuwen lukt het wel: gewoon verdergaan
  const tekst = rij.map(([k, v]) => k + ': ' + v).join('\n');
  app.innerHTML = `<div class="card fade" style="max-width:720px;margin:6vh auto"><h2>De database weigert het lezen van je toegang</h2>
    <p>Het inloggen is gelukt. Hieronder staat wat de site zojuist gemeten heeft. De weigering komt van de Firestore-beveiligingsregels van het project; die worden in de Firebase-console beheerd, niet in deze site.</p>
    <div class="scroll"><table><tbody>${rij.map(([k, v]) => `<tr><td><b>${esc(k)}</b></td><td class="small">${esc(v)}</td></tr>`).join('')}</tbody></table></div>
    <div class="row" style="margin-top:12px"><button class="pri" id="opnieuw">Opnieuw proberen</button><button id="kop">Kopieer diagnose</button><span class="sp"></span><button class="link" id="ander">Uitloggen</button></div><div id="dm"></div></div>`;
  $('#opnieuw').onclick = () => start(u);
  $('#ander').onclick = () => signOut(auth);
  $('#kop').onclick = async () => { try { await navigator.clipboard.writeText(tekst); $('#dm').innerHTML = '<div class="msg">Gekopieerd.</div>'; } catch (x) { $('#dm').innerHTML = `<div class="msg"><pre class="small" style="white-space:pre-wrap;margin:0">${esc(tekst)}</pre></div>`; } };
}

async function start(u) {
  app.innerHTML = '<p class="muted">Toegang controleren…</p>';
  let t;
  try { t = await getDoc(doc(db, 'toegang', u.email.toLowerCase())); }
  catch (e) {
    // Lezen geweigerd door de Firestore-regels is iets anders dan "niet op de lijst".
    if (e?.code === 'permission-denied') return diagnoseView(u, e);
    return noAccessView(u);
  }
  if (!t.exists()) return noAccessView(u);
  const data = t.data();
  // Door een beheerder aangemaakte gebruikers hoeven hun e-mail niet apart te bevestigen.
  if (!u.emailVerified && !data.aangemaaktDoorBeheer) return verifyView(u);
  S.user = u; S.rol = data.rol || 'lid'; S.naam = data.naam || u.email;
  // Eerste login met het standaardwachtwoord: eerst een eigen wachtwoord kiezen.
  if (data.moetWijzigen) return wachtwoordWijzigenView(u);
  $('#nav').classList.remove('hidden'); $('#who').classList.remove('hidden');
  $('#whoMail').textContent = S.naam;
  document.querySelectorAll('.beheer').forEach(a => a.classList.toggle('hidden', S.rol !== 'beheer'));
  startData(); route();
}

onAuthStateChanged(auth, u => {
  if (!u) { S.user = null; return authView(); }

/* ---------- Data ---------- */
function stopData() { S.unsub.forEach(f => f()); S.unsub = []; S.zones = {}; S.meta = null; S.team = []; S.targets = null; S.hp = null; S.eindejaar = null; S.uitrolData = undefined; S.uitrolVer = null; S.tekIdx = {}; }
function startData() {
  stopData();
  S.unsub.push(onSnapshot(ZONES(), snap => {
    S.zones = {}; snap.forEach(d => S.zones[d.id] = d.data()); S.loaded = true; rerender();
  }, e => { app.innerHTML = `<div class="msg bad">Kan de gegevens niet laden: ${esc(fout(e))}</div>`; }));
  S.unsub.push(onSnapshot(META(), d => { S.meta = d.exists() ? d.data() : null; rerender(); }, () => {}));
  S.unsub.push(onSnapshot(TARGETS(), d => { S.targets = d.exists() ? d.data() : null; rerender(); }, () => {}));
  S.unsub.push(onSnapshot(TEKIDX(), d => { S.tekIdx = d.exists() ? (d.data().zones || {}) : {}; if (view() !== 'uitrol') rerender(); }, () => {}));
  S.unsub.push(onSnapshot(EINDEJAAR(), d => { S.eindejaar = d.exists() ? d.data() : null; rerender(); }, () => {}));
  S.unsub.push(onSnapshot(HPLIJST(), d => { S.hp = d.exists() ? d.data() : null; rerender(); }, () => {}));
  S.unsub.push(onSnapshot(UITROL(), d => { S.uitrolData = d.exists() ? d.data() : null; if (view() === 'uitrol') rerender(); }, () => { S.uitrolData = null; }));
  if (S.rol === 'beheer') S.unsub.push(onSnapshot(collection(db, 'toegang'), snap => {
    S.team = []; snap.forEach(d => S.team.push({ email: d.id, ...d.data() }));
    S.team.sort((a, b) => (a.naam || a.email).localeCompare(b.naam || b.email)); if (view() === 'team') rerender();
  }, () => {}));
}

function zoneStats(z) {

/* ---------- Import ---------- */
const SOORTEN = {
  actuals: 'Actuals (uitgevoerd werk)',
  targets: 'HP-targets per maand',
  hp: 'HP per POC (Delivery planning)',
  eindejaar: 'Taken per zone uit WYRE eindejaar 2026',
  tekeningen: 'Voortgangstekeningen (tracker-HTML)',
  backup: 'Volledige back-up van WYRE Centraal'
};
const naamNaarZone = n => { const m = String(n).toUpperCase().replace(/[-\s]/g, '').match(/^(.*?)(\d+)POP(\d+)$/); return m ? WYRE.zoneId(m[1] + '_' + m[2], m[3]) : null; };
function leesSheets(wb) {
  return wb.SheetNames.map(n => {
    const ws = wb.Sheets[n];
    let maxR = 0; // sommige bladen zeggen 1 miljoen rijen; neem de echte laatste rij
    for (const k of Object.keys(ws)) if (k[0] !== '!') { const r = XLSX.utils.decode_cell(k).r; if (r > maxR) maxR = r; }
    if (ws['!ref']) { const rg = XLSX.utils.decode_range(ws['!ref']); rg.e.r = Math.min(rg.e.r, maxR); ws['!ref'] = XLSX.utils.encode_range(rg); }
    return { naam: n, rows: XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null }) };
  });
}
function herken(sheets, bestand) {
  const det = sheets.find(s => s.naam.toLowerCase() === 'detail per pop');
  if (det) { const pops = WYRE.parseTargets(det.rows); return { soort: 'targets', bestand, pops }; }
  if (sheets.some(s => s.naam.toLowerCase().startsWith('actuals'))) return { soort: 'actuals', bestand, ...WYRE.buildZones(sheets) };
  const hp = WYRE.parseHpLijst(sheets);
  if (hp.n) return { soort: 'hp', bestand, ...hp };
  return null;
}
function importView() {
  const p = S.pending;
  const st = (lbl, d) => `<tr><td>${lbl}</td><td>${d ? `${esc(d.bestand || '')}<div class="muted small">${d.op?.toDate ? d.op.toDate().toLocaleString('nl-BE', { dateStyle: 'short', timeStyle: 'short' }) : ''}${d.door ? ' · ' + esc(d.door) : ''}</div>` : '<span class="muted">nog niet ingeladen</span>'}</td></tr>`;
  app.innerHTML = `<div class="fade"><h1>Importeren</h1>
   <p class="muted">Kies een Excel. Ik herken zelf welk soort bestand het is. De Excel zelf wordt niet aangepast.</p>
   <div class="card"><table class="stack"><thead><tr><th>Bron</th><th>Laatst ingeladen</th></tr></thead><tbody>
    ${st('Actuals: <i>Actuals_lijst_WYRE_alle_zones…</i>', S.meta)}
    ${st('HP-targets per maand: <i>HP delivered … samenvatting</i> (blad "Detail per POP")', S.targets)}
    ${st('HP per POC: <i>Wyre MRO HP Delivery planning</i> (één tabblad per POP, alleen kolom # HP)', S.hp)}
    ${st('Taken per zone: <i>WYRE eindejaar 2026</i> (JSON uit het oude artifact)', S.eindejaar)}
   </tbody></table></div>
   <div class="card dp"><div class="row"><input type="file" id="xf" accept=".xlsx,.xlsm,.xls,.json,.html,.htm" multiple><span class="sp"></span>${p ? '<button id="annul">Annuleren</button><button class="pri" id="save">Opslaan in database</button>' : ''}</div>
   <div id="im"></div></div>
   ${p ? previewHtml(p) : `<div class="card dp"><h3>Verhuizen of reservekopie</h3><p class="muted small">Download alles wat in deze database staat (teamleden, Actuals, planning, uitrol en tekeningen) als één bestand. Dat bestand kun je hierboven weer inladen, ook op een andere server. Wachtwoorden zitten er niet in.</p><button id="bk">Volledige back-up downloaden</button><div id="bm"></div></div>`}</div>`;
  const bk = $('#bk');
  if (bk) bk.onclick = async () => {
    const zegB = (t, k = '') => $('#bm').innerHTML = `<div class="msg ${k}">${esc(t)}</div>`;
    bk.disabled = true;
    try {
      const docs = [];
      const zet = (pad, data) => { const o = {}; for (const [k, v] of Object.entries(data)) o[k] = (v && typeof v.toMillis === 'function') ? { __ts: v.toMillis() } : v; docs.push({ path: pad, data: o }); };
      zegB('Teamleden en POP-zones ophalen…');
      (await getDocs(collection(db, 'toegang'))).forEach(d => zet('toegang/' + d.id, d.data()));
      (await getDocs(ZONES())).forEach(d => zet('wyre/v1/zones/' + d.id, d.data()));
      zegB('Planning en uitrol ophalen…');
      for (const pad of ['wyre/v1/meta/import', 'wyre/v1/meta/tekeningen', 'wyre/v1/plan/targets', 'wyre/v1/plan/hp', 'wyre/v1/plan/eindejaar', 'wyre/v1/uitrol/novdec']) {
        const d = await getDoc(doc(db, ...pad.split('/'))); if (d.exists()) zet(pad, d.data());
      }
      const teks = (await getDocs(collection(db, 'wyre', 'v1', 'tekeningen'))).docs;
      for (const [i, d] of teks.entries()) {

      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `wyre-centraal-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      zegB(`Back-up gedownload: ${docs.length} onderdelen.`);

  const say = (t, k = '') => $('#im').innerHTML = `<div class="msg ${k}">${t}</div>`;
  $('#xf').onchange = async e => {

      for (const x of fs) {
        try {
          const t = WYRE.parseTracker(await x.text());

          const z1 = WYRE.trackerZone(t.plan); const m = t.plan.match(/POP_(\d{3})(\d{3})$/);

      S.pending = { soort: 'tekeningen', bestand: lijst.length + ' bestand(en)', lijst, fouten }; importView(); return;
    }

  let T; try { T = await laadTekening(id); } catch (e) { app.innerHTML = `<div class="msg bad">Kan de tekening niet laden: ${esc(fout(e))}</div>`; return; }
  if (view() !== 'tekening') return;
  if (!T) { app.innerHTML = `<p><a href="#overzicht">← Overzicht</a></p><div class="msg warn">Voor deze zone is nog geen tekening ingeladen.</div>`; return; }
  const rijen = (T.zones || []).flatMap(z => S.zones[z]?.rijen || []);
  const { on, los } = WYRE.kleurTekening(T.net, { rijen });
  const per = {}; for (const it of T.items) { const o = per[it.type] || (per[it.type] = [0, 0]); o[1]++; if (on[it.id]) o[0]++; }
  const ln = T.nodes.filter(n => !/M\d\d$/.test(n.code)); const lnOn = ln.filter(n => on[n.id]).length;
  const z0 = T.zones?.[0];
  app.innerHTML = `<div class="fade"><div class="row"><p style="margin:0"><a href="#${S.zones[z0] ? 'zone/' + esc(z0) : 'overzicht'}">← ${S.zones[z0] ? esc(S.zones[z0].label) : 'Overzicht'}</a></p><span class="sp"></span>
    <input id="tq" placeholder="Zoek kabel of POC, bv. 015A03" style="flex:0 1 260px"><label class="small row" style="gap:6px"><input type="checkbox" id="tghost" checked style="min-height:0">Open tracés tonen</label></div>
   <h1 style="margin-top:10px">${esc(T.titel)}</h1>
   <p class="muted small">Ingekleurd vanuit de Actuals in de database${S.meta?.op?.toDate ? ' (import ' + S.meta.op.toDate().toLocaleDateString('nl-BE') + ')' : ''}. Tekening: ${esc(T.bestand || '')}.</p>
   <div class="kpis">${Object.entries(per).map(([k, [a, b]]) => `<div class="kpi"><div class="v">${a}/${b}</div><div class="l"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:rgb(${TKOL[k]})"></span> ${TNAAM[k] || k} ${k === 'facade' || k === 'aerial' ? 'geplaatst' : 'geblazen'}</div></div>`).join('')}
    <div class="kpi"><div class="v">${lnOn}/${ln.length}</div><div class="l"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--las)"></span> PDP, DP en POC gelast</div></div></div>
   <div class="card" style="padding:0;overflow:hidden;position:relative"><canvas id="tc" style="display:block;width:100%;height:min(72vh,780px);touch-action:none;background:#fff;cursor:grab"></canvas>
    <div style="position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px"><button id="tzi" aria-label="Inzoomen">+</button><button id="tzo" aria-label="Uitzoomen">−</button><button id="tzf" aria-label="Hele tekening">⤢</button></div>
    <div id="ttip" style="position:absolute;display:none;pointer-events:none;background:#111827;color:#fff;font-size:12px;padding:6px 8px;border-radius:6px;max-width:360px;white-space:pre-line;z-index:3"></div></div>
   ${los.length ? `<details class="card dp"><summary>${los.length} Actuals-regels vonden geen plek op de tekening</summary><ul class="small">${los.map(r => `<li>${esc([r.d, r.w, r.k, r.p, r.c].filter(Boolean).join(' · '))}</li>`).join('')}</ul></details>` : ''}
  </div>`;
  const cv = $('#tc'), ctx = cv.getContext('2d'), tip = $('#ttip');
  let W = 0, H = 0, dpr = 1, sc = 1, ox = 0, oy = 0, ghost = true, hl = null;
  const [bx0, by0, bx1, by1] = T.items.concat(T.nodes.map(n => ({ bb: [n.x, n.y, n.x, n.y] }))).reduce((a, i) => [Math.min(a[0], i.bb[0]), Math.min(a[1], i.bb[1]), Math.max(a[2], i.bb[2]), Math.max(a[3], i.bb[3])], [1e9, 1e9, -1e9, -1e9]);
  const fit = () => { sc = Math.min(W / (bx1 - bx0 + 80), H / (by1 - by0 + 80)); ox = W / 2 - (bx0 + bx1) / 2 * sc; oy = H / 2 - (by0 + by1) / 2 * sc; };
  const tile = (z, x, y) => { const k = z + '/' + x + '/' + y; const b = T.tiles[k]; if (!b) return null; let im = T.imgs.get(k);
    if (!im) { im = new Image(); im.onload = () => draw(); im.src = 'data:image/webp;base64,' + b; T.imgs.set(k, im); } return im.complete && im.naturalWidth ? im : null; };
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    if (Object.keys(T.tiles).length) {
      const lv = T.lv || [0.5, 1, 2, 4], ts = T.ts || 512;
      let z = lv.findIndex(v => v >= sc * dpr); if (z < 0) z = lv.length - 1;
      const span = ts / lv[z];
      const x0 = Math.floor(-ox / sc / span), y0 = Math.floor(-oy / sc / span), x1 = Math.floor((W - ox) / sc / span), y1 = Math.floor((H - oy) / sc / span);
      for (let x = Math.max(0, x0); x <= x1; x++) for (let y = Math.max(0, y0); y <= y1; y++) {
        let im = tile(z, x, y), zz = z;
        if (!im) { for (zz = z - 1; zz >= 0; zz--) { const s2 = ts / lv[zz]; const im2 = tile(zz, Math.floor(x * span / s2), Math.floor(y * span / s2)); if (im2) { const sx = (x * span % s2) * lv[zz], sy = (y * span % s2) * lv[zz], sw = span * lv[zz];
            ctx.drawImage(im2, sx, sy, sw, sw, ox + x * span * sc, oy + y * span * sc, span * sc + 0.5, span * sc + 0.5); break; } } continue; }
        ctx.drawImage(im, ox + x * span * sc, oy + y * span * sc, span * sc + 0.5, span * sc + 0.5);
      }
    }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const path = it => { ctx.beginPath(); for (const q of it.parts) q.forEach(([x, y], i) => i ? ctx.lineTo(ox + x * sc, oy + y * sc) : ctx.moveTo(ox + x * sc, oy + y * sc)); };
    const lw = t => t === 'dist' ? 5 : t === 'prim' ? 7 : t === 'feed' ? 8 : 5;
    if (ghost) for (const it of T.items) if (!on[it.id]) { path(it); ctx.strokeStyle = 'rgba(120,120,120,.35)'; ctx.setLineDash([6, 5]); ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]); }
    for (const it of T.items) if (on[it.id]) { path(it); ctx.strokeStyle = `rgba(${TKOL[it.type] || '100,100,100'},.6)`; ctx.lineWidth = lw(it.type); ctx.stroke(); }
    for (const n of T.nodes) { const r = n.kind === 'POC' || n.kind === 'POC (MDU)' ? 5 : 8; ctx.beginPath(); ctx.arc(ox + n.x * sc, oy + n.y * sc, r, 0, 7);
      if (on[n.id]) { ctx.fillStyle = 'rgba(236,72,153,.75)'; ctx.fill(); } else if (ghost) { ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fill(); ctx.strokeStyle = 'rgba(120,120,120,.6)'; ctx.lineWidth = 1.5; ctx.stroke(); } }
    if (hl) { ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(ox + hl.x * sc, oy + hl.y * sc, 18, 0, 7); ctx.stroke(); }
  }
  const resize = () => { const r = cv.getBoundingClientRect(); dpr = devicePixelRatio || 1; const first = !W; W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; if (first) fit(); draw(); };
  const ro = new ResizeObserver(resize); ro.observe(cv);
  const zoom = (f, cx = W / 2, cy = H / 2) => { const n = Math.max(0.05, Math.min(20, sc * f)); ox = cx - (cx - ox) * n / sc; oy = cy - (cy - oy) * n / sc; sc = n; draw(); };
  cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  const pts = new Map(); let last = null, pinch = null;
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); last = [e.clientX, e.clientY]; if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); } });
  cv.addEventListener('pointermove', e => {
    const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    if (pts.has(e.pointerId)) {
      pts.set(e.pointerId, [e.clientX, e.clientY]);
      if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); zoom(d / pinch, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top); pinch = d; return; }
      ox += e.clientX - last[0]; oy += e.clientY - last[1]; last = [e.clientX, e.clientY]; tip.style.display = 'none'; draw(); return;
    }
    toon(mx, my);
  });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; };
  cv.addEventListener('pointerup', e => { const r = cv.getBoundingClientRect(); if (e.pointerType !== 'mouse') toon(e.clientX - r.left, e.clientY - r.top); up(e); });
  cv.addEventListener('pointercancel', up); cv.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
  function raak(mx, my) {
    let best = null, bd = 12;
    for (const n of T.nodes) { const d = Math.hypot(ox + n.x * sc - mx, oy + n.y * sc - my); if (d < bd) { bd = d; best = { n }; } }
    if (best) return best;
    bd = 8; const wx = (mx - ox) / sc, wy = (my - oy) / sc, tol = 8 / sc;
    for (const it of T.items) { const [a, b, c, d] = it.bb; if (wx < a - tol || wx > c + tol || wy < b - tol || wy > d + tol) continue;
      for (const q of it.parts) for (let i = 1; i < q.length; i++) { const [x1, y1] = q[i - 1], [x2, y2] = q[i]; const L = (x2 - x1) ** 2 + (y2 - y1) ** 2;
        const u = L ? Math.max(0, Math.min(1, ((wx - x1) * (x2 - x1) + (wy - y1) * (y2 - y1)) / L)) : 0; const dd = Math.hypot(x1 + u * (x2 - x1) - wx, y1 + u * (y2 - y1) - wy) * sc;
        if (dd < bd) { bd = dd; best = { it }; } } }
    return best;
  }
  function toon(mx, my) {
    const h = raak(mx, my);
    if (!h) { tip.style.display = 'none'; return; }
    const id = h.n ? h.n.id : h.it.id, o = on[id];
    const kop = h.n ? `${h.n.kind} ${h.n.code}` : `${TNAAM[h.it.type] || h.it.type} ${h.it.name}${h.it.cable && h.it.cable !== h.it.name ? ' (kabel ' + h.it.cable + ')' : ''}`;
    tip.textContent = kop + '\n' + (o ? (h.n ? 'Gelast' : (h.it.type === 'facade' || h.it.type === 'aerial' ? 'Geplaatst' : 'Geblazen')) + '\n' + [...new Set(o.info)].slice(0, 4).join('\n') : 'Nog niet uitgevoerd volgens de Actuals');
    tip.style.display = 'block'; tip.style.left = Math.min(mx + 14, W - 300) + 'px'; tip.style.top = (my + 14) + 'px';
  }
  $('#tzi').onclick = () => zoom(1.4); $('#tzo').onclick = () => zoom(1 / 1.4); $('#tzf').onclick = () => { fit(); draw(); };
  $('#tghost').onchange = e => { ghost = e.target.checked; draw(); };
  $('#tq').onkeydown = e => { if (e.key !== 'Enter') return; const q = e.target.value.trim().toUpperCase(); if (!q) return;
    const n = T.nodes.find(n => n.code === q || n.code === WYRE.normPoc(q)) || T.nodes.find(n => n.code.includes(q));
    const it = !n && T.items.find(i => i.name === q || i.cable === WYRE.normKabel(q));
    const p = n ? { x: n.x, y: n.y } : it ? { x: (it.bb[0] + it.bb[2]) / 2, y: (it.bb[1] + it.bb[3]) / 2 } : null;
    if (!p) return; sc = Math.max(sc, 1.2); ox = W / 2 - p.x * sc; oy = H / 2 - p.y * sc; hl = p; draw(); };
}

/* ---------- Team ---------- */
function teamView() {
  app.innerHTML = `<div class="fade"><h1>Team</h1>
   <p class="muted">Maak hier een gebruiker aan. Die krijgt het standaardwachtwoord <b>${STANDAARD_PW}</b> en moet dat bij de eerste keer inloggen zelf wijzigen. Beheerders kunnen ook importeren en het team beheren.</p>
   <form class="card" id="tf">
    <div class="row"><input type="email" id="te" placeholder="werk-e-mailadres" required style="flex:2 1 220px"><input id="tn" placeholder="naam" style="flex:1 1 160px">
     <select id="tr"><option value="lid">Lid</option><option value="beheer">Beheerder</option></select></div>
    <div class="row" style="margin-top:10px"><button class="pri" id="tmaak" type="submit">Gebruiker aanmaken (wachtwoord ${STANDAARD_PW})</button>
     <button class="link" id="ttoegang" type="button">Alleen toegang geven (gebruiker registreert zelf)</button></div>
   </form>
   <div id="tm"></div>
   <div class="card dp"><table class="stack"><thead><tr><th>Naam</th><th>E-mailadres</th><th>Rol</th><th></th></tr></thead><tbody>
   ${S.team.map(t => `<tr><td>${esc(t.naam || '')}${t.moetWijzigen ? ' <span class="chip" style="font-size:11px">nieuw wachtwoord</span>' : ''}${t.aangemaaktDoorBeheer ? ' <span class="chip" style="font-size:11px">aangemaakt door beheer</span>' : ''}</td><td>${esc(t.email)}</td><td>${t.rol === 'beheer' ? 'Beheerder' : 'Lid'}</td>
     <td class="n">${t.email === S.user.email.toLowerCase() ? '<span class="muted small">jij</span>' : `${t.aangemaaktDoorBeheer ? '' : `<button class="link" data-vrij="${esc(t.email)}">Toelaten zonder e-mailbevestiging</button> `}${t.moetWijzigen ? '' : `<button class="link" data-mw="${esc(t.email)}">Nieuw wachtwoord verplichten</button> `}<button class="link bad" data-del="${esc(t.email)}">Verwijderen</button>`}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Laden…</td></tr>'}
   </tbody></table></div>
   <p class="muted small">Verwijderen haalt het e-mailadres van de toegangslijst; de persoon kan dan niet meer inloggen. Het Firebase-account zelf blijft bestaan en kan alleen in de Firebase-console volledig verwijderd worden.</p></div>`;
  const say = (t, k = '') => $('#tm').innerHTML = `<div class="msg ${k}">${t}</div>`;
  const velden = () => ({ em: $('#te').value.trim().toLowerCase(), naam: $('#tn').value.trim(), rol: $('#tr').value });
  $('#tf').onsubmit = async e => {
    e.preventDefault();
    const { em, naam, rol } = velden();
    if (!em) return say('Vul een e-mailadres in.', 'bad');
    $('#tmaak').disabled = true; say('Aanmaken…');
    try {
      await createUserWithEmailAndPassword(auth2, em, STANDAARD_PW);
      await signOut(auth2);
      await setDoc(doc(db, 'toegang', em), { naam, rol, aangemaaktDoorBeheer: true, moetWijzigen: true, toegevoegdDoor: S.user.email, op: serverTimestamp() });
      say(`${esc(em)} aangemaakt. Standaardwachtwoord: ${STANDAARD_PW}. De gebruiker wijzigt dit bij de eerste login zelf.`);
      $('#tf').reset();
    } catch (err) {
      if (err?.code === 'auth/email-already-in-use') {
        try { await setDoc(doc(db, 'toegang', em), { naam, rol, aangemaaktDoorBeheer: true, toegevoegdDoor: S.user.email, op: serverTimestamp() }, { merge: true }); say(`Er bestond al een account voor ${esc(em)}. Toegang gegeven zonder e-mailbevestiging; het bestaande wachtwoord blijft gelden.`); $('#tf').reset(); }
        catch (e2) { say(fout(e2), 'bad'); }
      } else say(fout(err), 'bad');
    } finally { $('#tmaak').disabled = false; }
  };
  $('#ttoegang').onclick = async () => {
    const { em, naam, rol } = velden();
    if (!em) return say('Vul een e-mailadres in.', 'bad');
    try { await setDoc(doc(db, 'toegang', em), { naam, rol, toegevoegdDoor: S.user.email, op: serverTimestamp() }, { merge: true }); say(`${esc(em)} toegevoegd. De gebruiker registreert zelf met dit e-mailadres en kiest een eigen wachtwoord.`); $('#tf').reset(); }
    catch (err) { say(fout(err), 'bad'); }
  };
  app.querySelectorAll('[data-vrij]').forEach(b => b.onclick = async () => {
    try { await setDoc(doc(db, 'toegang', b.dataset.vrij), { aangemaaktDoorBeheer: true }, { merge: true }); say(`${esc(b.dataset.vrij)} mag nu inloggen zonder e-mailbevestiging.`); } catch (err) { say(esc(fout(err)), 'bad'); }
  });
  app.querySelectorAll('[data-mw]').forEach(b => b.onclick = async () => {
    try { await setDoc(doc(db, 'toegang', b.dataset.mw), { moetWijzigen: true }, { merge: true }); say(`${esc(b.dataset.mw)} moet bij de volgende login een nieuw wachtwoord kiezen.`); } catch (err) { say(esc(fout(err)), 'bad'); }
  });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Zeker? Klik nog eens'; return; }
    try { await deleteDoc(doc(db, 'toegang', b.dataset.del)); } catch (err) { say(esc(fout(err)), 'bad'); }
  });
}
